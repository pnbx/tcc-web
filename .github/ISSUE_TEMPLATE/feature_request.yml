name: Feature request
description: Suggest something the platform should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you (or a player) do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Describe the behaviour, not the implementation. UI sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tiers & testers
        - Store & payments
        - Players & stats
        - Staff panels
        - Minecraft integration
        - Telegram / bot
        - UI / RTL / fonts
        - Docs & tooling
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Alternatives you considered, related issues, or constraints (e.g. "must work without panel access").
