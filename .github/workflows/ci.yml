name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # `next build` needs a reachable database (the root layout reads settings),
  # so production builds are verified on Vercel rather than here. If you want a
  # build gate in CI, add a Postgres service container and point DATABASE_URL at
  # it, then run `npm run build` with the remaining env vars stubbed.
